name: Keep Supabase active
# Free-tier projects pause after about seven days without activity (CMP-BE-06).
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the moods table
        run: |
          curl --fail -sS "${{ vars.EXPO_PUBLIC_SUPABASE_URL }}/rest/v1/moods?select=code&limit=1" \
            -H "apikey: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}" -o /dev/null
